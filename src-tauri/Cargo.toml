[package]
name = "voice-note"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "voice_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                        = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state    = "2"
tauri-plugin-single-instance = "2"
serde                        = { version = "1.0", features = ["derive"] }
serde_json                   = "1.0"
tokio                        = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
reqwest                      = { version = "0.12", features = ["json"] }
base64                       = "0.22"
uuid                         = { version = "1", features = ["v4"] }
chrono                       = { version = "0.4", features = ["serde"] }
thiserror                    = "2.0"
arboard                      = "3"     # cross-platform clipboard for auto-insert
enigo                        = "0.2"   # cross-platform key simulation (Ctrl+V / Cmd+V)

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch = "0.2"  # GCD dispatch_sync to macOS main thread — required for AX API calls
objc = "0.2"      # Cocoa/AppKit bindings (NSWorkspace, NSRunningApplication) via msg_send! macro

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
